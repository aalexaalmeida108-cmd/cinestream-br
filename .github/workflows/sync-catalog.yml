name: Sync Catalog

on:
  schedule:
    # a cada 6 horas
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync catalog from bingebang.st
        run: python3 scripts/sync_catalog.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if git diff --staged --quiet; then
            echo "catálogo sem mudanças"
          else
            git commit -m "chore: sync catalog $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
